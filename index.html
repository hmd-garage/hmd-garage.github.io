async function htmlToPDF(html, filename, setBusy) {
  setBusy && setBusy(true);
  try {
    const holder = document.createElement("div");
    holder.style.cssText = "position:fixed;top:-10000px;right:-10000px;";
    holder.innerHTML = html;
    document.body.appendChild(holder);
    const node = holder.firstElementChild;
    await new Promise((r) => setTimeout(r, 120));
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    document.body.removeChild(holder);
    const img = canvas.toDataURL("image/jpeg", 0.92);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const margin = 10;
    const availW = pw - margin * 2;
    const imgH = canvas.height * availW / canvas.width;
    let y = margin;
    if (imgH <= ph - margin * 2) {
      pdf.addImage(img, "JPEG", margin, y, availW, imgH);
    } else {
      let remaining = imgH, pos = 0;
      const pageAvail = ph - margin * 2;
      const ratio = canvas.width / availW;
      while (remaining > 0) {
        const sliceH = Math.min(pageAvail, remaining);
        const sCanvas = document.createElement("canvas");
        sCanvas.width = canvas.width;
        sCanvas.height = sliceH * ratio;
        const ctx = sCanvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, sCanvas.width, sCanvas.height);
        ctx.drawImage(canvas, 0, pos * ratio, canvas.width, sliceH * ratio, 0, 0, canvas.width, sliceH * ratio);
        pdf.addImage(sCanvas.toDataURL("image/jpeg", 0.92), "JPEG", margin, margin, availW, sliceH);
        remaining -= sliceH;
        pos += sliceH;
        if (remaining > 0) pdf.addPage();
      }
    }
    pdf.save(filename);
  } catch (e) {
    alert("\u0635\u0627\u0631 \u062E\u0637\u0623 \u0623\u062B\u0646\u0627\u0621 \u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u0645\u0644\u0641. \u062A\u0623\u0643\u062F \u0645\u0646 \u0627\u062A\u0635\u0627\u0644 \u0627\u0644\u0625\u0646\u062A\u0631\u0646\u062A \u0648\u062D\u0627\u0648\u0644 \u0645\u0631\u0629 \u062B\u0627\u0646\u064A\u0629.");
    console.error(e);
  } finally {
    setBusy && setBusy(false);
  }
}

      if (hashes[car.id] === stamp && paths[car.id] === folder) continue;
      try {
        if (paths[car.id] && paths[car.id] !== folder) await this.movePath(paths[car.id], folder);
        await this.uploadText(folder + "/ملف السيارة.html", carFileHTML(car, svcs, insps, invs, gname));
        hashes[car.id] = stamp;
        paths[car.id] = folder;
        done++;
      } catch (e) {
      }
    }
    for (const cust of Object.keys(byCust)) {
      try {
        const list = byCust[cust];
        const stamp = hashOf("idx" + list.map((c) => c.id + (c.make || "") + (c.model || "")).join("|"));
        if (hashes["idx:" + cust] === stamp) continue;
        await this.uploadText(cust + "/الفهرس.html", customerIndexHTML(list, gname));
        hashes["idx:" + cust] = stamp;
      } catch (e) {
      }
    }
    const c2 = dbxStore.load();
    c2.fileHashes = hashes;
    c2.filePaths = paths;
    dbxStore.save(c2);
    return { done };
  }
};

function BookCalendar({ bookings, cursor, setCursor, selected, setSelected, now }) {

  while (cells.length % 7 !== 0) cells.push(null);

    if (!b.start) return false;
    const s = new Date(b.start), e = b.end ? new Date(b.end) : s;
    const d0 = new Date(day.getFullYear(), day.getMonth(), day.getDate()).getTime();
    const s0 = new Date(s.getFullYear(), s.getMonth(), s.getDate()).getTime();
    const e0 = new Date(e.getFullYear(), e.getMonth(), e.getDate()).getTime();
    return d0 >= s0 && d0 <= e0;

/* ===================== التقارير المالية ===================== */
const monthName = (y, m) => new Date(y, m, 1).toLocaleDateString(window.__LANG === "en" ? "en-GB" : "ar-KW", { month: "long", year: "numeric" });
const MONTHS_AR = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const invServiceText = (inv) => {
  const items = inv.items || [];
  const labor = items.filter((i) => i.section === "labor").map((i) => i.description).filter(Boolean);
  const parts = items.filter((i) => i.section !== "labor").map((i) => i.description).filter(Boolean);
  const all = labor.concat(parts).filter(Boolean);
  if (!all.length) return "—";
  return all.slice(0, 3).join("، ") + (all.length > 3 ? " (+" + (all.length - 3) + ")" : "");
};
function finPeriod(db, y, m) {
  const invs = (db.invoices || []).filter((i) => {
    if (i.internal) return false;
    const d = new Date(i.date);
    if (isNaN(d)) return false;
    return d.getFullYear() === y && (m == null || d.getMonth() === m);
  }).sort((a, b) => new Date(a.date) - new Date(b.date));
  const cars = db.cars || [];
  const rows = invs.map((inv) => {
    const t = invTotals(inv), pi = paidInfo(inv);
    const c = cars.find((x) => x.id === inv.plate);
    return {
      inv, no: inv.invoiceNumber, date: inv.date, plate: inv.plate,
      customer: c ? c.ownerName : "—",
      phone: c && c.ownerPhone ? "+" + (c.phoneCode || "965") + c.ownerPhone : "—",
      carTxt: c ? (c.make || "") + " " + (c.model || "") : "",
      service: invServiceText(inv),
      parts: t.partsSub - t.partsDisc, labor: t.laborSub - t.laborDisc,
      disc: t.discountAmount, total: t.total, paid: pi.paid, remaining: pi.remaining,
      methods: (inv.payments || []).map((p) => p.method).filter((v, i, a) => a.indexOf(v) === i).join("، ") || "—",
      status: pi.full ? "مدفوعة" : pi.pct > 0 ? "مدفوع " + pi.pct + "%" : "غير مدفوعة"
    };
  });
  // المحصّل فعلياً خلال الفترة (على أساس تاريخ الدفعة)
  let collected = 0;
  const byMethod = {};
  (db.invoices || []).forEach((inv) => {
    if (inv.internal) return;
    (inv.payments || []).forEach((p) => {
      const d = new Date(p.date || inv.date);
      if (isNaN(d) || d.getFullYear() !== y || (m != null && d.getMonth() !== m)) return;
      const a = Number(p.amount) || 0;
      collected += a;
      byMethod[p.method || "أخرى"] = (byMethod[p.method || "أخرى"] || 0) + a;
    });
    if (!inv.payments && inv.paid) {
      const d = new Date(inv.date);
      if (!isNaN(d) && d.getFullYear() === y && (m == null || d.getMonth() === m)) {
        const a = invTotals(inv).total;
        collected += a;
        byMethod["كاش"] = (byMethod["كاش"] || 0) + a;
      }
    }
  });
  const bookings = (db.bookings || []).filter((b) => { const d = new Date(b.start); return !isNaN(d) && d.getFullYear() === y && (m == null || d.getMonth() === m); });
  const bookRevenue = bookings.reduce((s, b) => s + (Number(b.price) || 0), 0);
  const bookPaid = bookings.filter((b) => b.paid).reduce((s, b) => s + (Number(b.price) || 0), 0);
  const services = (db.services || []).filter((s) => { const d = new Date(s.date); return !isNaN(d) && d.getFullYear() === y && (m == null || d.getMonth() === m); });
  const internal = (db.invoices || []).filter((i) => { const d = new Date(i.date); return i.internal && !isNaN(d) && d.getFullYear() === y && (m == null || d.getMonth() === m); });
  const internalCost = internal.reduce((s, i) => s + invTotals(i).total, 0);
  const sum = (f) => rows.reduce((s, r) => s + f(r), 0);
  return {
    rows, invoiced: sum((r) => r.total), collected, outstanding: sum((r) => r.remaining),
    parts: sum((r) => r.parts), labor: sum((r) => r.labor), disc: sum((r) => r.disc),
    count: rows.length, avg: rows.length ? sum((r) => r.total) / rows.length : 0,
    byMethod, bookings, bookRevenue, bookPaid, services: services.length, internalCost, internalCount: internal.length
  };
}
function agingBuckets(db, asOf) {
  const b = { d30: 0, d60: 0, d90: 0, older: 0, rows: [] };
  (db.invoices || []).forEach((inv) => {
    if (inv.internal) return;
    const pi = paidInfo(inv);
    if (pi.remaining <= 5e-4) return;
    const days = Math.floor((asOf - new Date(inv.date)) / 864e5);
    const k = days <= 30 ? "d30" : days <= 60 ? "d60" : days <= 90 ? "d90" : "older";
    b[k] += pi.remaining;
    b.rows.push({ inv, days, remaining: pi.remaining });
  });
  b.rows.sort((x, y2) => y2.remaining - x.remaining);
  b.total = b.d30 + b.d60 + b.d90 + b.older;
  return b;
}

DBX.linkFor = async function (path) {
  try {
    const tok = await this.token();
    let r = await fetch("https://api.dropboxapi.com/2/sharing/create_shared_link_with_settings", {
      method: "POST", headers: { "Authorization": "Bearer " + tok, "Content-Type": "application/json" },
      body: JSON.stringify({ path })
    });
    if (r.ok) { const j = await r.json(); return j.url; }
    r = await fetch("https://api.dropboxapi.com/2/sharing/list_shared_links", {
      method: "POST", headers: { "Authorization": "Bearer " + tok, "Content-Type": "application/json" },
      body: JSON.stringify({ path, direct_only: true })
    });
    if (r.ok) { const j = await r.json(); if (j.links && j.links.length) return j.links[0].url; }
  } catch (e) {}
  return null;
};
DBX.listAll = async function (root) {
  const tok = await this.token();
  let out = [], cursor = null;
  let r = await fetch("https://api.dropboxapi.com/2/files/list_folder", {
    method: "POST", headers: { "Authorization": "Bearer " + tok, "Content-Type": "application/json" },
    body: JSON.stringify({ path: root || "", recursive: true, limit: 2000 })
  });
  if (!r.ok) throw new Error("list failed " + r.status);
  let j = await r.json();
  out = out.concat(j.entries || []);
  cursor = j.has_more ? j.cursor : null;
  while (cursor) {
    r = await fetch("https://api.dropboxapi.com/2/files/list_folder/continue", {
      method: "POST", headers: { "Authorization": "Bearer " + tok, "Content-Type": "application/json" },
      body: JSON.stringify({ cursor })
    });
    if (!r.ok) break;
    j = await r.json();
    out = out.concat(j.entries || []);
    cursor = j.has_more ? j.cursor : null;
  }
  return out;
};
DBX.syncFiles = async function (db) {
  if (!this.connected() || !db || !Array.isArray(db.cars)) return { done: 0 };
  const cfg = dbxStore.load();
  const hashes = cfg.fileHashes || {};
  const paths = cfg.filePaths || {};
  const gname = db.garageName || "";
  const byCust = {};
  let done = 0;
  const rekey = (oldP, newP) => {
    Object.keys(paths).forEach((k) => {
      if (paths[k] === oldP) paths[k] = newP;
      else if (paths[k] && paths[k].indexOf(oldP + "/") === 0) paths[k] = newP + paths[k].slice(oldP.length);
    });
  };
  for (const car of db.cars) {
    const svcs = (db.services || []).filter((x) => x.plate === car.id);
    const insps = (db.inspections || []).filter((x) => x.plate === car.id);
    const invs = (db.invoices || []).filter((x) => x.plate === car.id);
    const bks = (db.bookings || []).filter((x) => x.plate === car.id);
    const folder = carFolder(car);
    const cust = custFolder(car);
    (byCust[cust] = byCust[cust] || []).push(car);
    if (paths[car.id] && paths[car.id] !== folder) {
      try { await this.movePath(paths[car.id], folder); rekey(paths[car.id], folder); } catch (e) {}
    }
    const stamp = hashOf(JSON.stringify([car, svcs, insps, bks, invs.map((v) => ({ ...v, images: (v.images || []).map((im) => im.name) })), gname]));
    if (hashes[car.id] !== stamp || paths[car.id] !== folder) {
      try {
        await this.uploadText(folder + "/ملف السيارة.html", carFileHTML(car, svcs, insps, invs, gname, bks));
        hashes[car.id] = stamp; paths[car.id] = folder; done++;
      } catch (e) {}
    }
    for (const v of invs) {
      const key = "inv:" + v.id;
      const p = folder + "/الفواتير/" + invFileName(v);
      const st = hashOf(JSON.stringify([v, car, gname]));
      if (hashes[key] === st && paths[key] === p) continue;
      try {
        if (paths[key] && paths[key] !== p) await this.deletePath(paths[key]);
        await this.uploadText(p, wrapDoc(v.invoiceNumber || "فاتورة", invoiceHTML(v, car, gname)));
        hashes[key] = st; paths[key] = p; done++;
      } catch (e) {}
    }
    for (const x of insps) {
      const key = "insp:" + x.id;
      const p = folder + "/تقارير الفحص/" + inspFileName(x);
      const st = hashOf(JSON.stringify([x, car, gname]));
      if (hashes[key] === st && paths[key] === p) continue;
      try {
        if (paths[key] && paths[key] !== p) await this.deletePath(paths[key]);
        await this.uploadText(p, wrapDoc("تقرير فحص " + (car.plate || ""), inspectionHTML(x, car, gname)));
        hashes[key] = st; paths[key] = p; done++;
      } catch (e) {}
    }
  }
  for (const cust of Object.keys(byCust)) {
    try {
      const list = byCust[cust];
      const bks = (db.bookings || []).filter((b) => list.some((c) => c.id === b.plate) || (b.phone && list.some((c) => digits(c.ownerPhone) === digits(b.phone))));
      const stamp = hashOf("idx2" + list.map((c) => c.id + (c.make || "") + (c.model || "") + (c.civilId || "")).join("|") + bks.map((b) => b.id + b.status + b.end).join("|"));
      if (hashes["idx:" + cust] === stamp) continue;
      await this.uploadText(cust + "/الفهرس.html", customerIndexHTML(list, gname, bks));
      hashes["idx:" + cust] = stamp;
      done++;
    } catch (e) {}
  }
  const c2 = dbxStore.load();
  c2.fileHashes = hashes;
  c2.filePaths = paths;
  c2.lastFileSync = Date.now();
  dbxStore.save(c2);
  return { done };
};

/* ---------- بناء شجرة الملفات من البيانات المحلية ---------- */
function buildFileTree(db) {
  const map = {};
  (db.cars || []).forEach((car) => {
    const cf = custFolder(car);
    if (!map[cf]) map[cf] = { path: cf, name: car.ownerName || "—", phone: car.ownerPhone ? "+" + (car.phoneCode || "965") + car.ownerPhone : "", civilId: car.civilId || "", cars: [] };
    if (!map[cf].civilId && car.civilId) map[cf].civilId = car.civilId;
    const invs = (db.invoices || []).filter((v) => v.plate === car.id).sort((a, b) => new Date(b.date) - new Date(a.date));
    const insps = (db.inspections || []).filter((v) => v.plate === car.id).sort((a, b) => new Date(b.date) - new Date(a.date));
    const svcs = (db.services || []).filter((v) => v.plate === car.id);
    const bks = (db.bookings || []).filter((v) => v.plate === car.id);
    const imgs = invs.reduce((s, v) => s + ((v.images || []).length), 0);
    map[cf].cars.push({ car, folder: carFolder(car), invs, insps, svcs, bks, imgs });
  });
  return Object.values(map).sort((a, b) => (b.cars.length - a.cars.length) || String(a.name).localeCompare(String(b.name)));
}

const EXPENSE_CATS = ["إيجار", "مخزن", "رواتب", "كهرباء وماء", "مشتريات ومخزون", "معدات وصيانة", "تسويق", "رخص ورسوم", "وقود ومواصلات", "أخرى"];
const EXP_PERIODS = { monthly: "شهري ثابت", yearly: "سنوي", once: "مرة واحدة" };
const EXP_COLORS = { "إيجار": "#33404A", "مخزن": "#2C6E76", "رواتب": "#7C4FBF", "كهرباء وماء": "#C46F12", "مشتريات ومخزون": "#3E8F5C", "معدات وصيانة": "#BE5136", "تسويق": "#E8871E", "رخص ورسوم": "#5B655F", "وقود ومواصلات": "#8A6D3B", "أخرى": "#5B655F" };

const catOf = (x) => {
  const c = (x && x.category) || "أخرى";
  return c === "أخرى" ? (String(x && x.categoryOther || "").trim() || "أخرى") : c;
};
function expenseInMonth(x, y, m) {
  const amt = Number(x.amount) || 0;
  if (!amt || x.active === false) return 0;
  const d = x.date ? new Date(x.date) : null;
  if (x.period === "monthly" || !x.period) {
    if (d && !isNaN(d) && (y < d.getFullYear() || (y === d.getFullYear() && m < d.getMonth()))) return 0;
    if (x.endDate) {
      const ed = new Date(x.endDate);
      if (!isNaN(ed) && (y > ed.getFullYear() || (y === ed.getFullYear() && m > ed.getMonth()))) return 0;
    }
    return amt;
  }
  if (!d || isNaN(d)) return 0;
  return d.getFullYear() === y && d.getMonth() === m ? amt : 0;
}
function expenseInYear(x, y) {
  let s = 0;
  for (let i = 0; i < 12; i++) s += expenseInMonth(x, y, i);
  return s;
}
function expensesForPeriod(db, y, m) {
  const list = db.expenses || [];
  const rows = list.map((x) => ({ x, amount: m == null ? expenseInYear(x, y) : expenseInMonth(x, y, m) })).filter((r) => r.amount > 0)
    .sort((a, b) => b.amount - a.amount);
  const byCat = {};
  rows.forEach((r) => { const k = catOf(r.x); byCat[k] = (byCat[k] || 0) + r.amount; });
  return { rows, byCat, total: rows.reduce((s, r) => s + r.amount, 0), monthlyFixed: list.filter((x) => (x.period || "monthly") === "monthly" && x.active !== false).reduce((s, x) => s + (Number(x.amount) || 0), 0) };
}
function garageCarStats(db, y, m) {
  const gcars = (db.cars || []).filter((c) => c.isGarageCar);
  const spentOf = (plate) => (db.invoices || []).filter((i) => i.plate === plate).reduce((s, i) => s + invTotals(i).total, 0);
  const inPeriod = (iso) => {
    if (!iso) return false;
    const d = new Date(iso);
    return !isNaN(d) && d.getFullYear() === y && (m == null || d.getMonth() === m);
  };
  const rows = gcars.map((c) => {
    const purchase = Number(c.purchasePrice) || 0;
    const spent = spentOf(c.id);
    const sale = Number(c.salePrice) || 0;
    const sold = c.saleStatus === "sold";
    return { c, purchase, spent, cost: purchase + spent, sale, sold, profit: sold ? sale - purchase - spent : 0, soldAt: c.soldAt || null, inP: sold ? (c.soldAt ? inPeriod(c.soldAt) : m == null) : false };
  });
  const soldRows = rows.filter((r) => r.inP);
  const openRows = rows.filter((r) => !r.sold);
  return {
    rows, soldRows, openRows,
    soldRevenue: soldRows.reduce((s, r) => s + r.sale, 0),
    soldCost: soldRows.reduce((s, r) => s + r.cost, 0),
    profit: soldRows.reduce((s, r) => s + r.profit, 0),
    invested: openRows.reduce((s, r) => s + r.cost, 0),
    count: gcars.length
  };
}

/* ---------- تصدير Excel ملوّن (يفتح بالألوان في Excel و Google Sheets) ---------- */
function downloadXLS(filename, title, subtitle, blocks) {
  const esc = (x) => String(x == null ? "" : x).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);
  const cell = (v) => {
    if (v && typeof v === "object") {
      const st = [];
      if (v.bold) st.push("font-weight:bold");
      if (v.color) st.push("color:" + v.color);
      if (v.bg) st.push("background:" + v.bg);
      if (v.money) st.push('mso-number-format:"0\\.000"');
      if (v.align) st.push("text-align:" + v.align);
      return '<td style="' + st.join(";") + '">' + (v.money ? (Number(v.v) || 0).toFixed(3) : esc(v.v)) + "</td>";
    }
    return "<td>" + esc(v) + "</td>";
  };
  const body = blocks.map((b) => {
    const head = b.headers && b.headers.length ? "<tr>" + b.headers.map((x) => '<th>' + esc(x) + "</th>").join("") + "</tr>" : "";
    const rows = (b.rows || []).map((r) => "<tr>" + r.map(cell).join("") + "</tr>").join("");
    const span = Math.max(1, (b.headers || []).length || (b.rows && b.rows[0] ? b.rows[0].length : 1));
    return '<tr><td colspan="' + span + '" class="sec">' + esc(b.title) + "</td></tr>" + head + rows + '<tr><td colspan="' + span + '" class="gap"></td></tr>';
